<!DOCTYPE html>

<html>

<head>

<title>Admin Login</title>

<style>

body{

background:#050505;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;

}


.box{

background:#111;
padding:40px;
border-radius:20px;
box-shadow:0 0 30px purple;
text-align:center;

}


input,button{

padding:12px;
margin:10px;
border-radius:10px;
border:none;

}


button{

background:#8b5cf6;
color:white;
cursor:pointer;

}

</style>

</head>


<body>


<div class="box">

<h1>Admin Login</h1>


<form method="POST" action="/login">


<input 
type="password"
name="password"
placeholder="Password">


<br>


<button>
Login
</button>


</form>


</div>


</body>

</html>
